<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Cadastrar Fornecedor | VERA</title>
  <link rel="icon" type="image/png" href="assets/images/faricon.png" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="css/register.css" />

</head>

<body>
   <!-- Carregamento da tela  -->
  <div class="loader">
    <img src="assets/images/logo.png" alt="VERA" />
  </div> 

  <!-- CADASTRO DE FORNECEDOR -->
  <section class="auth-page">
    <a href="index.html" class="back-button"> ← Voltar </a>

    <!-- LADO VISUAL -->
    <aside class="auth-visual">
      <div class="overlay"></div>

      <div class="visual-content">
        <img src="assets/images/logo.png" class="visual-logo" alt="VERA Logo" />

        <span class="mini-text"> PARCEIROS VERA </span>

        <h1>
          Torne-se um <em>fornecedor</em> parceiro da VERA
        </h1>

        <p class="visual-footer">
          <strong>VERA</strong> é a plataforma ideal para venda de suas jóias
        </p>
      </div>
    </aside>

    <!-- FORMULÁRIO -->
    <main class="auth-form-side">
      <div class="auth-container">
        <img src="assets/images/logo.png" class="form-logo mobile-logo" alt="Logo" />

        <h2>Cadastro de fornecedor</h2>

        <form class="auth-form" id="fornecedor-form" action="cadastrar_fornecedor.php" method="POST" novalidate>

          <!-- DADOS DA EMPRESA -->
          <fieldset class="form-section">
            <legend class="section-title">Dados da empresa</legend>

            <div class="form-grid">
              <div class="input-group span-4">
                <input type="text" id="nomeEmpresa" name="nomeEmpresa" placeholder="Razão Social" required />
              </div>

              <div class="input-group span-2">
                <input type="text" id="nomeFantasia" name="nomeFantasia" placeholder="Nome fantasia" required />
              </div>

              <div class="input-group span-2">
                <input type="text" id="cnpj" name="cnpj" placeholder="CNPJ" inputmode="numeric"
                  data-mask="cnpj" maxlength="18" required />
              </div>

              <div class="input-group span-2">
                <input type="text" id="nacionalidade" name="nacionalidade" placeholder="Nacionalidade"
                  value="Brasileira" />
              </div>

              <div class="input-group span-2">
                <input type="tel" id="telefone" name="telefone" placeholder="Telefone"
                  data-mask="phone" maxlength="15" required />
              </div>

              <div class="input-group span-4">
                <input type="email" id="email" name="email" placeholder="E-mail" required />
              </div>
            </div>
          </fieldset>

          <!-- ENDEREÇO -->
          <fieldset class="form-section">
            <legend class="section-title">Endereço</legend>

            <div class="form-grid">
              <div class="input-group span-2">
                <input type="text" id="cep" name="cep" placeholder="CEP" inputmode="numeric"
                  data-mask="cep" maxlength="9" required />
              </div>

              <div class="input-group span-3">
                <input type="text" id="logradouro" name="logradouro" placeholder="Logradouro" required />
              </div>

              <div class="input-group span-1">
                <input type="text" id="numero" name="numero" placeholder="Nº" required />
              </div>

              <div class="input-group span-2">
                <input type="text" id="bairro" name="bairro" placeholder="Bairro" required />
              </div>

              <div class="input-group span-3">
                <input type="text" id="cidade" name="cidade" placeholder="Cidade" required />
              </div>

              <div class="input-group span-1">
                <input type="text" id="uf" name="uf" placeholder="UF" maxlength="2" required />
              </div>
            </div>
          </fieldset>

          <!-- SEGURANÇA -->
          <fieldset class="form-section">
            <legend class="section-title">Segurança</legend>

            <div class="form-grid">
              <div class="input-group span-3 password-group">
                <input type="password" id="senha" name="senha" placeholder="Senha" required />
                <i class="fa-regular fa-eye toggle-password" data-target="#senha"></i>
              </div>

              <div class="input-group span-3 password-group">
                <input type="password" id="confirmar-senha" name="confirmar_senha"
                  placeholder="Confirme a senha" required />
                <i class="fa-regular fa-eye toggle-password" data-target="#confirmar-senha"></i>
              </div>
            </div>

            <p class="form-error" id="form-error" role="alert"></p>
          </fieldset>

          <!-- BOTÃO -->
          <div class="submit-row">
            <button type="submit" class="register-btn">
              <span>Cadastrar fornecedor</span>
            </button>
          </div>

        </form>

        <!-- LOGIN -->
        <p class="signup-text">
          Já é um fornecedor cadastrado?
          <a href="login.html">Entrar</a>
        </p>
      </div>
    </main>
  </section>

  <script src="js/fornecedor.js"></script>

</body>

</html>
