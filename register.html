<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Criar conta | VERA</title>
  <link rel="icon" type="image/png" href="assets/images/faricon.png" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="css/register.css" />
</head>

<body>
  <!-- Carregamento da tela -->
  <div class="loader">
    <img src="assets/images/logo.png" alt="VERA" />
  </div> 

  <!-- CADASTRO -->
  <section class="auth-page">
    <a href="index.html" class="back-button"> ← Voltar </a>

    <!-- LADO VISUAL -->
    <aside class="auth-visual">
      <div class="overlay"></div>

      <div class="visual-content">
        <img src="assets/images/logo.png" class="visual-logo" alt="VERA Logo" />

        <span class="mini-text"> EXPERIÊNCIA PREMIUM </span>

        <h1>
          Torne sua experiência B2C em algo <em>valioso</em>
        </h1>

        <p class="visual-footer">
          <strong>VERA</strong> é a plataforma ideal para venda de suas jóias
        </p>
      </div>
    </aside>

    <!-- FORMULÁRIO -->
    <main class="auth-form-side">
      <div class="auth-container">
        <img src="assets/images/logo.png" class="form-logo mobile-logo" alt="Logo" />

        <h2>Crie sua conta</h2>

        <form class="auth-form" id="register-form" action="cadastrar_usuario.php" method="POST" novalidate>

          <!-- DADOS PESSOAIS E DE NEGÓCIO -->
          <fieldset class="form-section">
            <legend class="section-title">Dados pessoais</legend>

            <div class="form-grid">
              <div class="input-group span-4">
                <input type="text" id="nome" name="nome" placeholder="Nome completo" required />
              </div>

              <div class="input-group span-2">
                <input type="text" id="cpf" name="cpf" placeholder="CPF" inputmode="numeric"
                  data-mask="cpf" maxlength="14" required />
              </div>

              <div class="input-group span-4">
                <input type="email" id="email" name="email" placeholder="E-mail" required />
              </div>

            <!-- CNPJ é pra fornecedor e essa tela é usuarios   <div class="input-group span-2">
                <input type="text" id="cnpj" name="cnpj" placeholder="CNPJ" inputmode="numeric"
                  data-mask="cnpj" maxlength="18" />
              </div> -->

              <div class="input-group span-2">
                <input type="tel" id="telefone-pessoal" name="telefone_pessoal" placeholder="Telefone pessoal"
                  data-mask="phone" maxlength="15" />
              </div>

              <div class="input-group span-4">
                <input type="text" id="login" name="login" placeholder="Login" />
              </div>
              
             <div class="input-group span-2">
                <input type="tel" id="telefone-comercial" name="telefone_comercial" placeholder="Telefone comercial"
                  data-mask="phone" maxlength="15" />
              </div>

            </div>
          </fieldset>

          <!-- DADOS DE LOCALIZAÇÃO -->
          <fieldset class="form-section">
            <legend class="section-title">Dados de localização</legend>

            <div class="form-grid">
              <div class="input-group span-2">
                <input type="text" id="cep" name="cep" placeholder="CEP" inputmode="numeric"
                  data-mask="cep" maxlength="9" />
              </div>

              <div class="input-group span-3">
                <input type="text" id="logradouro" name="logradouro" placeholder="Logradouro" />
              </div>

              <div class="input-group span-1">
                <input type="text" id="numero" name="numero" placeholder="Nº" />
              </div>

              <div class="input-group span-2">
                <input type="text" id="bairro" name="bairro" placeholder="Bairro" />
              </div>

              <div class="input-group span-3">
                <input type="text" id="cidade" name="cidade" placeholder="Cidade" />
              </div>

              <div class="input-group span-1">
                <input type="text" id="uf" name="uf" placeholder="UF" maxlength="2" />
              </div>

              <!-- ESTRANGEIRO -->
              <label class="checkbox-group span-2" for="estrangeiro">
                <input type="checkbox" id="estrangeiro" name="estrangeiro" />
                <span>Sou estrangeiro</span>
              </label>

              <div class="input-group span-2">
                <input type="text" id="nacionalidade" name="nacionalidade" placeholder="Nacionalidade" disabled />
              </div>

              <div class="input-group span-2">
                <input type="text" id="documento" name="documento" placeholder="Documento" disabled />
              </div>
            </div>
          </fieldset>

          <!-- SEGURANÇA -->
          <fieldset class="form-section">
            <legend class="section-title">Segurança</legend>

            <div class="form-grid">
              <div class="input-group span-3 password-group">
                <input type="password" id="senha" name="senha" placeholder="Senha" required />

                <i class="fa-regular fa-eye toggle-password" data-target="#senha"></i>
              </div>

              <div class="input-group span-3 password-group">
                <input type="password" id="confirmar-senha" name="confirmar_senha"
                  placeholder="Confirme a senha" required />

                <i class="fa-regular fa-eye toggle-password" data-target="#confirmar-senha"></i>
              </div>
            </div>

            <p class="form-error" id="form-error" role="alert"></p>
          </fieldset>

          <!-- BOTÃO -->
          <div class="submit-row">
            <button type="submit" class="register-btn">
              <span>Criar conta</span>
            </button>
          </div>

        </form>

        <!-- LOGIN -->
        <p class="signup-text">
          Já possui uma conta?
          <a href="login.html">Entrar</a>
        </p>
      </div>
    </main>
  </section>

    <script src="js/register.js"></script>
    
</body>

</html>
