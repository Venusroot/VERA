services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: vera-web:latest
    ports:
      - "8000:80"
    environment:
      DB_HOST: db
      DB_NAME: vera
      DB_USER: adm
      DB_PASS: adm
    extra_hosts:
      - "db:host-gateway"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    command: --bind-address=0.0.0.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: vera
      MYSQL_USER: adm
      MYSQL_PASSWORD: adm
    volumes:
      - db_data:/var/lib/mysql
      - ./vera.sql:/docker-entrypoint-initdb.d/vera.sql:ro

volumes:
  db_data: