services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: vera-web:latest
    ports:
      - "${WEB_PORT:-8000}:80"
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-vera}
      DB_USER: ${DB_USER:-vera}
      DB_PASS: ${DB_PASS:-vera_local_dev_change_me}
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    command: --bind-address=0.0.0.0
    ports:
      - "127.0.0.1:${MYSQL_FORWARD_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_dev_change_me}
      MYSQL_DATABASE: ${DB_NAME:-vera}
      MYSQL_USER: ${DB_USER:-vera}
      MYSQL_PASSWORD: ${DB_PASS:-vera_local_dev_change_me}
    volumes:
      - db_data:/var/lib/mysql
      - ./vera.sql:/docker-entrypoint-initdb.d/vera.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  db_data: